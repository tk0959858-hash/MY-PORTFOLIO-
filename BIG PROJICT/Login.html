<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Talha Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f5f5f5;">
    <header class="main-header">
        <div class="container" style="justify-content: center;">
            <a href="index.html" class="logo">
                <i class="fas fa-shopping-bag"></i> Talha<span>Store</span>
            </a>
        </div>
    </header>

    <div class="container">
        <div class="auth-container">
            <h2 style="text-align: center; margin-bottom: 25px; color: var(--secondary-color);">Welcome Back!</h2>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="log-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="log-password" required placeholder="Enter your password">
                </div>
                <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
                    <label style="display: flex; align-items: center; gap: 5px; font-weight: normal; margin: 0;">
                        <input type="checkbox" style="width: auto;"> Remember Me
                    </label>
                    <a href="#" style="font-size: 14px; color: var(--primary-color);">Forgot Password?</a>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Login</button>
            </form>
            <div class="auth-links">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
