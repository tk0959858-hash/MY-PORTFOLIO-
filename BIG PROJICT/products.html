<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Talha Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
            <a href="index.html" class="logo">
                <i class="fas fa-shopping-bag"></i>
                Talha<span>Store</span>
            </a>
            
            <form class="search-bar" id="search-form">
                <input type="text" id="search-input" placeholder="Search in Talha Store...">
                <button type="submit"><i class="fas fa-search"></i></button>
            </form>
            
            <div class="header-icons">
                <a href="wishlist.html" class="icon-link">
                    <i class="far fa-heart"></i>
                    <span class="badge" id="wishlist-badge" style="display: none;">0</span>
                </a>
                <a href="cart.html" class="icon-link">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="badge" id="cart-badge" style="display: none;">0</span>
                </a>
                <a href="profile.html" class="icon-link">
                    <i class="far fa-user"></i>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="products-layout">
            <!-- Filters Sidebar -->
            <aside class="sidebar">
                <div class="filter-group">
                    <h3>Categories</h3>
                    <ul class="filter-list">
                        <li><label><input type="radio" name="category" value="all" checked> All Categories</label></li>
                        <li><label><input type="radio" name="category" value="mobiles"> Mobiles</label></li>
                        <li><label><input type="radio" name="category" value="computers"> Computers</label></li>
                        <li><label><input type="radio" name="category" value="electronics"> Electronics</label></li>
                        <li><label><input type="radio" name="category" value="men's fashion"> Men's Fashion</label></li>
                        <li><label><input type="radio" name="category" value="women's fashion"> Women's Fashion</label></li>
                        <li><label><input type="radio" name="category" value="shoes"> Shoes</label></li>
                        <li><label><input type="radio" name="category" value="beauty"> Beauty</label></li>
                        <li><label><input type="radio" name="category" value="home & kitchen"> Home & Kitchen</label></li>
                        <li><label><input type="radio" name="category" value="grocery"> Grocery</label></li>
                        <li><label><input type="radio" name="category" value="sports"> Sports</label></li>
                    </ul>
                </div>
                <!-- Adding more filters just for visual consistency with requirements -->
                <div class="filter-group">
                    <h3>Rating</h3>
                    <ul class="filter-list">
                        <li><label><input type="radio" name="rating" value="4"> 4 Stars & Up</label></li>
                        <li><label><input type="radio" name="rating" value="3"> 3 Stars & Up</label></li>
                    </ul>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <div class="products-header">
                    <h2 id="products-page-title">All Products</h2>
                    <select class="sort-select" id="sort-select">
                        <option value="default">Sort by Default</option>
                        <option value="popular">Popularity</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Top Rated</option>
                    </select>
                </div>
                
                <div class="product-grid" id="all-products-grid">
                    <!-- Populated by JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Footer snippet -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                &copy; 2026 Talha Store. All Rights Reserved.
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
