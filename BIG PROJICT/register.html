<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Talha Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f5f5f5;">
    <header class="main-header">
        <div class="container" style="justify-content: center;">
            <a href="index.html" class="logo">
                <i class="fas fa-shopping-bag"></i> Talha<span>Store</span>
            </a>
        </div>
    </header>

    <div class="container">
        <div class="auth-container">
            <h2 style="text-align: center; margin-bottom: 25px; color: var(--secondary-color);">Create your Account</h2>
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="reg-phone" required placeholder="Enter your phone number">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" required placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="reg-confirm-password" required placeholder="Confirm your password">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Register</button>
            </form>
            <div class="auth-links">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
