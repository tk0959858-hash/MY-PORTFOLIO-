<!DOCTYPE flexible html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Student Management</title>

    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons for beautiful sleek icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo">
                    <i class="ph-fill ph-student"></i>
                </div>
                <h2>Nexus</h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <i class="ph ph-squares-four"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-users"></i>
                    <span>Students</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-books"></i>
                    <span>Courses</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="Admin" class="avatar">
                    <div class="user-info">
                        <p class="user-name">Admin User</p>
                        <p class="user-role">Superadmin</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="topbar">
                <div class="search-bar">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search students by name or email...">
                </div>
                <div class="topbar-actions">
                    <button class="icon-btn">
                        <i class="ph ph-bell"></i>
                    </button>
                    <button class="primary-btn" id="addStudentBtn">
                        <i class="ph ph-plus"></i>
                        New Student
                    </button>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="content-wrapper">
                <!-- Stats Overview -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon purple">
                            <i class="ph ph-users-three"></i>
                        </div>
                        <div class="stat-details">
                            <h3>Total Students</h3>
                            <p class="stat-number" id="totalStudentsStat">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <i class="ph ph-book-open"></i>
                        </div>
                        <div class="stat-details">
                            <h3>Active Courses</h3>
                            <p class="stat-number">12</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <i class="ph ph-check-circle"></i>
                        </div>
                        <div class="stat-details">
                            <h3>Active Students</h3>
                            <p class="stat-number" id="activeStudentsStat">0</p>
                        </div>
                    </div>
                </div>

                <!-- Students Table Section -->
                <div class="table-section">
                    <div class="table-header">
                        <h2>Recent Enrollments</h2>
                        <div class="filter-group">
                            <select id="courseFilter" class="modern-select">
                                <option value="all">All Courses</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Design">Design</option>
                                <option value="Business">Business</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="table-container">
                        <table id="studentsTable">
                            <thead>
                                <tr>
                                    <th>Student</th>
                                    <th>Student ID</th>
                                    <th>Course</th>
                                    <th>Status</th>
                                    <th>Date Added</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentsList">
                                <!-- Student rows will be injected here via JS -->
                            </tbody>
                        </table>
                        
                        <!-- Empty State -->
                        <div id="emptyState" class="empty-state hidden">
                            <div class="empty-icon">
                                <i class="ph ph-users"></i>
                            </div>
                            <h3>No Students Found</h3>
                            <p>Get started by adding a new student to the system.</p>
                            <button class="primary-btn mt-4" id="emptyAddBtn">
                                <i class="ph ph-plus"></i> Add First Student
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Add/Edit Student -->
    <div class="modal-overlay" id="studentModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Student</h3>
                <button class="close-btn" id="closeModalBtn">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <input type="hidden" id="studentId">
                    
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required placeholder="e.g. John Doe">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="e.g. john@example.com">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="course">Course</label>
                            <select id="course" required>
                                <option value="" disabled selected>Select a course</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Design">Design</option>
                                <option value="Business">Business</option>
                                <option value="Engineering">Engineering</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" required>
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                                <option value="Suspended">Suspended</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="secondary-btn" id="cancelBtn">Cancel</button>
                        <button type="submit" class="primary-btn">Save Student</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
