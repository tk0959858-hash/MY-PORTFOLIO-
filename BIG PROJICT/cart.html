<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Talha Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-shopping-bag"></i> Talha<span>Store</span>
            </a>
            <div class="header-icons">
                <a href="profile.html" class="icon-link"><i class="far fa-user"></i></a>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title" style="margin-top: 30px;">Shopping Cart</h2>
        
        <div class="cart-layout">
            <div class="cart-items" id="cart-items-container">
                <!-- Populated by JS -->
            </div>
            
            <div class="cart-summary">
                <h3 style="margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">Rs. 0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Fee</span>
                    <span>Rs. 150</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="cart-total">Rs. 0</span>
                </div>
                <a href="checkout.html" class="btn" style="width: 100%; margin-top: 15px;">PROCEED TO CHECKOUT</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
